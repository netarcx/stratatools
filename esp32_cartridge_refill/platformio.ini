; Standalone Stratasys cartridge refill — ESP32-C3
;
; Build/upload:  pio run -t upload
; Serial debug:  pio device monitor   (115200 baud)
;
; Host validation of the crypto codec (no hardware needed):
;   g++ -std=c++11 -I lib/stratasys -I test \
;       lib/stratasys/des.cpp lib/stratasys/stratasys_codec.cpp test/host_test.cpp \
;       -o /tmp/host_test && /tmp/host_test

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    paulstoffregen/OneWire @ ^2.3.7
build_flags =
    -std=gnu++11
    ; --- Serial-over-USB ---------------------------------------------------
    ; Most "generic ESP32-C3" devkits (e.g. the C3 SuperMini, which matches the
    ; GPIO8-LED / GPIO9-button wiring this firmware uses) have ONLY the chip's
    ; native USB and no UART bridge. Without these flags `Serial` goes to the
    ; UART0 pins, which aren't on the USB connector, so you get NO serial output.
    ; These route `Serial` to the native USB CDC port.
    ;
    ; If your board instead has a separate USB-UART bridge (CP2102 / CH340 — the
    ; genuine Espressif DevKitM-1), DELETE these two flags or you'll lose output
    ; (Serial would then go to native USB, which that board doesn't expose).
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
