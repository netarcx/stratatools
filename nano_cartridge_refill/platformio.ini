; Standalone Stratasys cartridge refill — Arduino Nano (ATmega328P)
;
; Build/upload:  pio run -t upload          (new bootloader, 115200)
;                pio run -e nano_old -t upload
;                                           (old bootloader clones, 57600)
; Serial debug:  pio device monitor         (115200 baud)
;
; Host validation of the crypto codec (no hardware needed):
;   g++ -std=c++11 -I lib/stratasys -I lib/backup -I test \
;       lib/stratasys/des.cpp lib/stratasys/stratasys_codec.cpp lib/stratasys/f64.cpp \
;       lib/backup/cartridge_backup.cpp test/host_test.cpp -o /tmp/host_test && /tmp/host_test

[platformio]
default_envs = nano

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
; lib/backup includes a header from lib/stratasys; the default LDF mode does not
; always follow includes between two project libraries.
lib_ldf_mode = deep+
lib_deps =
    paulstoffregen/OneWire @ ^2.3.7
build_flags =
    -Wall
    -Os

; Most Nanos sold since ~2018 ship the newer bootloader (115200 upload).
[env:nano]
board = nanoatmega328new

; Older boards and many clones use the original bootloader (57600 upload).
; Symptom of picking the wrong one: avrdude "not in sync" / stk500 timeouts.
[env:nano_old]
board = nanoatmega328

; The Uno and Pro Mini 5V/16MHz are the same ATmega328P and run this unchanged.
[env:uno]
board = uno

; Pro Micro, 5V / 16MHz (ATmega32U4). Same wiring as the Nano -- it brings out
; D2-D10, so every pin the firmware uses is available at the same number. The
; firmware detects the chip and disables the onboard-LED mirror, since a Pro
; Micro does not bring D13 out to a pad.
;
; Use the 5V/16MHz variant, not the 3.3V/8MHz one: this cartridge's DS2433 is
; parasite-powered, and the strong pull-up that carries it through the EEPROM
; programming window has noticeably more to give at 5V.
;
; Uploading differs from the Nano -- the 32U4 is reset into its bootloader by a
; 1200-baud touch, and the serial port number changes when it re-enumerates.
[env:promicro16]
board = sparkfun_promicro16
