<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530" role="img" aria-labelledby="t d">
  <title id="t">Pro Micro cartridge refill unit wiring</title>
  <desc id="d">A Pro Micro drives a 1-Wire data line on D7 with a 4.7k pull-up to VCC. A switch in that line, on the board side of the pull-up, connects it to a DS2433 inside the cartridge. Only two conductors cross into the cartridge: data and ground, so the chip is parasite-powered. Green and red LEDs on D6 and D8 via 330 ohm resistors, and a button on D9 to ground.</desc>

  <!-- The file carries its own ground so it stays legible in either GitHub theme. -->
  <rect x="0" y="0" width="800" height="530" fill="#F5F8F9"/>

  <g font-family="'IBM Plex Sans',-apple-system,Segoe UI,sans-serif" fill="#14181C">

    <text x="40" y="40" font-size="18" font-weight="600">Pro Micro — cartridge refill unit</text>
    <text x="40" y="60" font-size="12" fill="#4E5960">ATmega32U4, 5&#160;V / 16&#160;MHz. Same pin numbers as the Nano.</text>

    <!-- ── Pro Micro board ── -->
    <rect x="80" y="95" width="170" height="230" rx="6" fill="#FFFFFF" stroke="#14181C" stroke-width="2"/>
    <text x="165" y="122" font-size="13" font-weight="600" text-anchor="middle">PRO MICRO</text>
    <text x="165" y="138" font-size="10" fill="#4E5960" text-anchor="middle">ATmega32U4</text>

    <!-- USB-C on the board edge -->
    <rect x="68" y="190" width="12" height="36" fill="#14181C"/>
    <text x="60" y="213" font-size="11" text-anchor="end">USB-C</text>
    <text x="60" y="228" font-size="10" fill="#4E5960" text-anchor="end">5 V in</text>

    <!-- right-edge pin labels -->
    <text x="242" y="134" font-size="12" font-weight="600" text-anchor="end">VCC</text>
    <text x="242" y="179" font-size="12" font-weight="600" text-anchor="end">D7</text>
    <text x="242" y="229" font-size="12" font-weight="600" text-anchor="end">GND</text>
    <!-- bottom-edge pin labels -->
    <text x="115" y="316" font-size="12" font-weight="600" text-anchor="middle">D6</text>
    <text x="168" y="316" font-size="12" font-weight="600" text-anchor="middle">D8</text>
    <text x="221" y="316" font-size="12" font-weight="600" text-anchor="middle">D9</text>

    <g stroke="#14181C" stroke-width="2" fill="none" stroke-linecap="round">

      <!-- VCC out and down through the pull-up onto the data line -->
      <line x1="250" y1="130" x2="400" y2="130"/>
      <line x1="400" y1="130" x2="400" y2="140"/>
      <rect x="390" y="140" width="20" height="30" fill="#FFFFFF"/>
      <line x1="400" y1="170" x2="400" y2="175"/>

      <!-- 1-Wire data: board → junction → switch → cartridge -->
      <line x1="250" y1="175" x2="490" y2="175"/>
      <line x1="555" y1="175" x2="700" y2="175"/>

      <!-- shared ground, straight through to the chip -->
      <line x1="250" y1="225" x2="700" y2="225"/>

      <!-- switch: blade drawn open, dashed line showing the closed path -->
      <line x1="490" y1="175" x2="548" y2="150"/>
      <line x1="490" y1="175" x2="555" y2="175" stroke-dasharray="3 4" stroke-width="1.4" stroke="#4E5960"/>

      <!-- LED and button legs -->
      <line x1="115" y1="325" x2="115" y2="348"/>
      <rect x="105" y="348" width="20" height="30" fill="#FFFFFF"/>
      <line x1="115" y1="378" x2="115" y2="398"/>
      <line x1="115" y1="424" x2="115" y2="455"/>

      <line x1="168" y1="325" x2="168" y2="348"/>
      <rect x="158" y="348" width="20" height="30" fill="#FFFFFF"/>
      <line x1="168" y1="378" x2="168" y2="398"/>
      <line x1="168" y1="424" x2="168" y2="455"/>

      <line x1="221" y1="325" x2="221" y2="392"/>
      <line x1="221" y1="418" x2="221" y2="455"/>
      <!-- momentary button -->
      <line x1="209" y1="392" x2="233" y2="392"/>
      <line x1="209" y1="418" x2="233" y2="418"/>
      <line x1="215" y1="392" x2="215" y2="386"/>
      <line x1="227" y1="392" x2="227" y2="386"/>

      <!-- ground bus -->
      <line x1="115" y1="455" x2="221" y2="455"/>
      <line x1="168" y1="455" x2="168" y2="466"/>
      <line x1="152" y1="466" x2="184" y2="466"/>
      <line x1="158" y1="473" x2="178" y2="473"/>
      <line x1="164" y1="480" x2="172" y2="480"/>
    </g>

    <!-- junction where the pull-up meets the data line -->
    <circle cx="400" cy="175" r="4.5" fill="#14181C"/>
    <!-- switch terminals -->
    <circle cx="490" cy="175" r="4.5" fill="#FFFFFF" stroke="#14181C" stroke-width="2"/>
    <circle cx="555" cy="175" r="4.5" fill="#FFFFFF" stroke="#14181C" stroke-width="2"/>

    <!-- LED symbols -->
    <g fill="#14803F" stroke="#14803F" stroke-width="2" stroke-linejoin="round">
      <polygon points="105,398 125,398 115,418"/>
      <line x1="103" y1="422" x2="127" y2="422"/>
    </g>
    <g fill="#B3372C" stroke="#B3372C" stroke-width="2" stroke-linejoin="round">
      <polygon points="158,398 178,398 168,418"/>
      <line x1="156" y1="422" x2="180" y2="422"/>
    </g>

    <text x="418" y="162" font-size="12">4.7 kΩ</text>
    <text x="115" y="500" font-size="11" text-anchor="middle" fill="#14803F" font-weight="600">GREEN</text>
    <text x="168" y="500" font-size="11" text-anchor="middle" fill="#B3372C" font-weight="600">RED</text>
    <text x="221" y="500" font-size="11" text-anchor="middle">BUTTON</text>
    <text x="258" y="368" font-size="11" fill="#4E5960">330 Ω each</text>
    <text x="258" y="410" font-size="11" fill="#4E5960">to GND, internal pull-up</text>

    <!-- switch, the part people get wrong -->
    <text x="522" y="126" font-size="13" font-weight="600" text-anchor="middle" fill="#8F5F10">SWITCH</text>
    <text x="522" y="205" font-size="11" text-anchor="middle" fill="#8F5F10">ON = chip connected</text>
    <text x="522" y="220" font-size="11" text-anchor="middle" fill="#8F5F10">OFF = code 1-1</text>

    <!-- cartridge boundary: only two conductors cross it -->
    <rect x="700" y="95" width="72" height="250" rx="6" fill="none" stroke="#4E5960" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="736" y="88" font-size="11" text-anchor="middle" fill="#4E5960">CARTRIDGE</text>
    <rect x="700" y="150" width="72" height="100" rx="4" fill="#FFFFFF" stroke="#14181C" stroke-width="2"/>
    <text x="736" y="196" font-size="13" font-weight="600" text-anchor="middle">DS2433</text>
    <text x="736" y="212" font-size="10" fill="#4E5960" text-anchor="middle">EEPROM</text>

    <text x="690" y="166" font-size="11" text-anchor="end">DATA</text>
    <text x="690" y="216" font-size="11" text-anchor="end">GND</text>

    <text x="736" y="290" font-size="11" text-anchor="middle" font-weight="600">Two wires only</text>
    <text x="736" y="305" font-size="10" text-anchor="middle" fill="#4E5960">no VCC — the chip</text>
    <text x="736" y="318" font-size="10" text-anchor="middle" fill="#4E5960">draws power from</text>
    <text x="736" y="331" font-size="10" text-anchor="middle" fill="#4E5960">the data line</text>

    <!-- the two notes that stop this being wired wrong -->
    <line x1="400" y1="440" x2="772" y2="440" stroke="#C3CCD1" stroke-width="1"/>
    <text x="400" y="462" font-size="11" font-weight="600">The pull-up sits on the board side of the switch.</text>
    <text x="400" y="477" font-size="11" fill="#4E5960">Opening it takes D7 and the 4.7 kΩ off the cartridge line together, so</text>
    <text x="400" y="490" font-size="11" fill="#4E5960">the printer sees an undisturbed bus. Leave it ON and the printer</text>
    <text x="400" y="503" font-size="11" fill="#4E5960">cannot read the cartridge at all.</text>
  </g>
</svg>
