; 1-Wire wiring test -- a self-contained project so it never disturbs the
; refill firmware's build. Nothing here is shared with ../../src.
;
;   pio run -t upload            (new bootloader, 115200)
;   pio run -e nano_old -t upload
;                                (old bootloader clones, 57600)
;   pio device monitor           (115200)

[platformio]
default_envs = nano
; The sketch sits beside this file rather than in src/: it is one file, and
; keeping it flat is what makes it openable in the Arduino IDE as-is.
src_dir = .

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
lib_deps =
    paulstoffregen/OneWire @ ^2.3.7
build_flags =
    -Wall
    -Os

[env:nano]
board = nanoatmega328new

[env:nano_old]
board = nanoatmega328

[env:uno]
board = uno
